/**:
  ros__parameters:
    nmpc_config:
      ref_velocity: 5.0             # 期望巡航速度 (m/s)
      control_loop_ms: 50           # 控制循环周期 (毫秒)
      enable_warm_start: False

    safety:
      max_cte_ratio: 0.66
      recovery_velocity: 0.5

    track:
      road_half_width: 7.0
      use_virtual_walls: True

    perception:
      dbscan_eps: 1.2               # DBSCAN 邻域搜索半径
      dbscan_min_pts: 3             # 形成簇所需的最小点数
      fov_half_angle_deg: 100.0     # 机器人前方视野半角 (度)

    obstacle_avoidance:
      max_obstacles: 5              # 求解器支持的最大障碍物数量
      base_margin: 1.0              # 基础安全距离/机器人半径 (米)
      speed_gain: 0.0              # 随速度增加的动态裕度增益
      smoothing_alpha: 0.2          # 法向量一阶低通滤波系数 (0-1)
      invalid_obs_pos: -100.0       # 无效/远端障碍物的占位坐标
      norm_epsilon: 0.01            # 防止向量归一化除零的极小值

    robot_limits:
      max_linear_velocity: 5.0      # 最大线速度限制 (m/s)
      min_linear_velocity: 0.0      # 最小线速度限制 (m/s)
      max_angular_velocity: 2.0     # 最大角速度限制 (rad/s)
      min_angular_velocity: -2.0    # 最小角速度限制 (rad/s)

    eso:
      enable: True
      omega_linear: 10.0
      omega_angular: 10.0
      b0_linear: 1.0
      b0_angular: 1.0